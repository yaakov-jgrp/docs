<text x="80" y="669.1999999999999" font-size="11" font-family="Helvetica,Arial,sans-serif">Cost: $$ &nbsp;|&nbsp; Book capacity: ~3.0 Billy equiv. (92" tall book run @ 15"D, 6 shelves ≈ 46 LF)</text>
<text x="80" y="687.1999999999999" font-size="11" font-family="Helvetica,Arial,sans-serif">Central play (approx): Primary clear play ≈ 4.8' × 8.3' (plus overflow toward stair path)</text>
<text x="80" y="705.1999999999999" font-size="11" font-family="Helvetica,Arial,sans-serif">Widens room?: YES — tall mass only on short back wall; left is mostly low+sofa; rug can run crosswise</text>
<text x="80" y="723.1999999999999" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#333">Why wider: avoids dual tall long walls. Front windows light the desk. Stair path stays open along</text>
<text x="80" y="737.1999999999999" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#333">right. Weakness: play strip is elongated; desk only comfortably seats 2.</text>
